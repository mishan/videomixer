[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv
# gi.require_version() has to run before the gi.repository imports, so those
# imports cannot sit at the top of the file.
per-file-ignores =
    tests/*:E402
    mix.py:E402
    videomixer.py:E402
    rtmpsource.py:E402

[tool:pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
